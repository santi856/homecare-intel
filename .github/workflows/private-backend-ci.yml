name: HomeCare Intel | Private Backend Tests
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'autonomy/**'
      - '.github/workflows/private-backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/private-backend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing operating logic
        run: npm --prefix autonomy test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck webhook without connecting to Stripe or Supabase
        run: deno check supabase/functions/stripe-webhook/index.ts
      - name: Create local Supabase-like DB roles
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
      - name: Apply private SQL migration
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610140001_autonomous_operations.sql
      - name: Verify payment handling, private access, and idempotency
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            result jsonb;
            n integer;
          BEGIN
            IF has_function_privilege('anon','public.accept_hci_stripe_event(text,text,boolean,text,text,text,text,text,text,text,text,bigint,text)','execute') THEN
              RAISE EXCEPTION 'Anonymous role must not execute Stripe receiver';
            END IF;
            IF NOT has_function_privilege('service_role','public.accept_hci_stripe_event(text,text,boolean,text,text,text,text,text,text,text,text,bigint,text)','execute') THEN
              RAISE EXCEPTION 'Service role must be allowed to invoke Stripe receiver';
            END IF;
            result := public.accept_hci_stripe_event(
              p_event_id=>'evt_1',
              p_event_type=>'checkout.session.completed',
              p_live=>true,
              p_session_id=>'cs_integration_1',
              p_link_id=>'plink_1UPQ9PLTIwtoxZQIDUVEywTW',
              p_session_status=>'complete',
              p_payment_status=>'paid',
              p_customer_email=>'customer@example.invalid',
              p_amount_total=>29900,
              p_currency=>'usd');
            IF (result->>'orderCreated') IS DISTINCT FROM 'true' THEN
              RAISE EXCEPTION 'Paid checkout did not create order: %', result;
            END IF;
            result := public.accept_hci_stripe_event(
              p_event_id=>'evt_1',p_event_type=>'checkout.session.completed',p_live=>true);
            IF (result->>'duplicate') IS DISTINCT FROM 'true' THEN
              RAISE EXCEPTION 'Identical event was not deduplicated';
            END IF;
            result := public.accept_hci_stripe_event(
              p_event_id=>'evt_2',
              p_event_type=>'checkout.session.async_payment_succeeded',
              p_live=>true,
              p_session_id=>'cs_integration_1',
              p_link_id=>'plink_1UPQ9PLTIwtoxZQIDUVEywTW',
              p_session_status=>'complete',p_payment_status=>'paid');
            SELECT count(*) INTO n FROM homecare_ops.orders;
            IF n<>1 THEN RAISE EXCEPTION 'Double-paid same checkout produced % orders',n; END IF;
            SELECT count(*) INTO n FROM homecare_ops.jobs WHERE order_session_id='cs_integration_1';
            IF n<>1 THEN RAISE EXCEPTION 'One paid checkout created % jobs',n; END IF;
            result := public.accept_hci_stripe_event(
              p_event_id=>'evt_testonly',p_event_type=>'checkout.session.completed',
              p_live=>false,p_session_id=>'cs_test',
              p_session_status=>'complete',p_payment_status=>'paid');
            SELECT count(*) INTO n FROM homecare_ops.orders;
            IF n<>1 THEN RAISE EXCEPTION 'Sandbox event created a production order'; END IF;
          END $$;
          SQL
